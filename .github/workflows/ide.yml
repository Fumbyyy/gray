name: ide

on:
  pull_request:
    paths:
      - 'ide/**'
      - 'crates/**'
      - '.github/workflows/ide.yml'
  push:
    branches: [main]
    paths:
      - 'ide/**'
      - 'crates/**'
      - '.github/workflows/ide.yml'

permissions:
  contents: read

concurrency:
  group: ide-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-2025
            label: windows-11
          - os: windows-2022
            label: windows-10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ide
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.label == 'linux'
        name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev
      - name: Build gray-ide
        run: cargo build --locked --manifest-path ide/Cargo.toml
      - name: Run gray-ide tests
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --manifest-path ide/Cargo.toml
      - name: Smoke check the binary exists
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "windows-11" ] || [ "${{ matrix.label }}" = "windows-10" ]; then
            test -f ide/target/debug/gray-ide.exe
          else
            test -f ide/target/debug/gray-ide
          fi
