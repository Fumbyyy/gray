[workspace]

[package]
name = "gray-ide"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Native GPUI desktop surface for the gray agent harness"

[dependencies]
gray = { path = "../crates/gray" }
gray-core = { path = "../crates/gray-core" }
gpui = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
tokio-util = "0.7"
flume = "0.11"
unicode-segmentation = "1"
anyhow = "1"
clap = "4"
serde_json = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
xattr = { path = "vendor-xattr" }
